<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت ربات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; }
        #debug { font-size: 12px; color: gray; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="main-content">
        <h2>🎛 تنظیمات ربات</h2>
        
        <div class="card">
            <div class="toggle-row">
                <span>🤖 یوزربات فعال</span>
                <input type="checkbox" id="userbot_active" onchange="sendUpdate('userbot_active', this.checked)">
            </div>
            <div class="toggle-row">
                <span>🛠 حالت تعمیرات</span>
                <input type="checkbox" id="maintenance_mode" onchange="sendUpdate('maintenance_mode', this.checked)">
            </div>
            <div class="toggle-row">
                <span>🔕 حالت بیصدا</span>
                <input type="checkbox" id="silent_mode" onchange="sendUpdate('silent_mode', this.checked)">
            </div>
        </div>

        <button class="btn" onclick="sendAction('restart')">🔄 ریستارت ربات</button>
        <button class="btn" style="background-color: #e53935; margin-top: 10px;" onclick="tg.close()">❌ بستن پنل</button>
    </div>

    <div id="debug"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // تمام صفحه شدن

        // 1. خواندن تنظیمات از آدرس لینک (URL Parameters)
        // این بخش حیاتی است: اطلاعات را از لینکی که پایتون ساخته می‌خواند
        const urlParams = new URLSearchParams(window.location.search);
        
        // تابع کمکی برای تنظیم تیک‌ها
        function setToggle(id) {
            const val = urlParams.get(id);
            if (val === '1' || val === 'true') {
                document.getElementById(id).checked = true;
            } else {
                document.getElementById(id).checked = false;
            }
        }

        // اعمال تنظیمات اولیه
        setToggle('userbot_active');
        setToggle('maintenance_mode');
        setToggle('silent_mode');

        // نمایش اطلاعات برای دیباگ (که بفهمیم لینک چی بوده)
        document.getElementById('debug').innerText = "Link Data: " + window.location.search;

        // 2. ارسال تغییرات به ربات
        function sendUpdate(key, value) {
            const data = {
                action: "update_setting",
                key: key,
                value: value
            };
            tg.sendData(JSON.stringify(data));
        }

        function sendAction(actionName) {
            const data = {
                action: "command",
                key: actionName
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
